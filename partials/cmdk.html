<div class="cmdk" id="cmdk" hidden>
  <div class="cmdk-scrim" data-cmdk-close></div>
  <div class="cmdk-panel" role="dialog" aria-modal="true" aria-labelledby="cmdkLabel">
    <h2 class="sr-only" id="cmdkLabel">Search prompts</h2>
    <div class="cmdk-field">
      <svg class="icon cmdk-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input type="text" id="cmdkInput" class="cmdk-input" placeholder="Search prompts, categories, use cases&hellip;" autocomplete="off" spellcheck="false"
             role="combobox" aria-expanded="true" aria-controls="cmdkResults" aria-autocomplete="list">
      <kbd class="cmdk-esc">esc</kbd>
    </div>
    <div class="cmdk-results" id="cmdkResults" role="listbox" aria-label="Results"></div>
    <div class="cmdk-foot">
      <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> navigate</span>
      <span><kbd>&crarr;</kbd> open</span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>
