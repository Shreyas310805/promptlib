<!-- The reveal dialog. Shared by index.html and images.html; filled by
     openPromptModal() from whichever prompt object the page has.

     The layout is a three-part column on the right: a header that stays,
     the prompt in a box that scrolls on its own, and the actions pinned
     under it. A 100-word prompt therefore cannot push Copy off screen,
     which is what happened when the whole panel scrolled as one. -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalStyleName">
    <button class="modal-close" id="modalClose" aria-label="Close"></button>

    <div class="modal-image-wrap"><div class="modal-swatch" id="modalSwatch"></div></div>

    <div class="modal-body">
      <header class="modal-head">
        <div class="modal-meta">
          <span class="badge badge-model" id="modalModel"></span>
          <span class="badge badge-input" id="modalInput"></span>
        </div>
        <h3 class="modal-style-name" id="modalStyleName"></h3>
        <p class="modal-summary" id="modalSummary"></p>
      </header>

      <div class="modal-prompt">
        <div class="modal-prompt-bar">
          <span class="modal-prompt-label">Full prompt</span>
          <span class="modal-prompt-hint" id="modalPromptMeta"></span>
        </div>
        <div class="modal-prompt-scroll">
          <p class="prompt-text" id="modalPromptText"></p>
        </div>
      </div>

      <footer class="modal-actions">
        <button class="btn btn-primary btn-copy" id="modalCopyBtn"></button>
        <div class="send-row" id="modalSendRow"></div>
        <p class="modal-howto">Attach your own photo in ChatGPT or Gemini, then paste this alongside it. Both buttons copy the prompt first.</p>
      </footer>
    </div>
  </div>
</div>
