<script>
/* Bootstrap — keep inline and keep it tiny. Sets html.js for the few
   rules that legitimately need to know JS is running.

   It does not reveal the page: that is a pure CSS animation, so page
   visibility depends on neither this script nor script.js.

   It also restores the saved theme before paint, which is the one thing
   that genuinely cannot wait for script.js: applying it later means a
   visible flash of the wrong theme on every load. */
document.documentElement.classList.add("js");
/* Applied before the first paint, or the page renders dark and then snaps
   to light a frame later. Stored choice wins; with none, follow the OS. */
try {
  var t = localStorage.getItem("promptlib-theme");
  if (t !== "light" && t !== "dark") {
    t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  }
  document.documentElement.setAttribute("data-theme", t);
} catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
</script>
