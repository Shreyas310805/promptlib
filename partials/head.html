<script>
/* Bootstrap — keep inline and keep it tiny. Opts this page into the CSS fade
   only while JS is running, then guarantees a reveal on load even if script.js
   never arrives. An external file here could 404 and take the page with it. */
document.documentElement.classList.add("js");
try {
  var t = localStorage.getItem("promptlib-theme");
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
} catch (e) { /* private mode / storage blocked — dark default is fine */ }
addEventListener("load", function(){ document.body.classList.add("loaded"); });
</script>
