<script>
/* Bootstrap — keep inline and keep it tiny. Sets html.js for the few rules
   that legitimately need to know JS is running, and applies the stored theme
   before first paint so switching never flashes.

   It no longer reveals the page: that is a pure CSS animation now, so page
   visibility does not depend on this script, on script.js, or on either of
   them running without throwing. */
document.documentElement.classList.add("js");
try {
  var t = localStorage.getItem("promptlib-theme");
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
} catch (e) { /* private mode / storage blocked — dark default is fine */ }
</script>
